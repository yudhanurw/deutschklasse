<style>

body{

.prose-de .de{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:500}
.prose-de .hi{color:var(--gold);font-weight:600}
.prose-de .dim{color:var(--ink-3)}
.prose-de .note{color:var(--ink-2);font-size:.96rem}
.prose-de p + p{margin-top:9px}
.prose-de ul.bul{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.prose-de ul.bul li{position:relative;padding-left:18px;font-size:.95rem}
.prose-de ul.bul li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:2px;background:var(--accent)}
.prose-de .tscroll{
  overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:6px;
  -webkit-overflow-scrolling:touch;
  background:
    linear-gradient(to right, var(--surface) 30%, rgba(0,0,0,0)),
    linear-gradient(to right, rgba(0,0,0,0), var(--surface) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%, rgba(20,40,38,.22), rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%, rgba(20,40,38,.22), rgba(0,0,0,0)) 100% 0;
  background-repeat:no-repeat;
  background-size:44px 100%, 44px 100%, 16px 100%, 16px 100%;
  background-attachment:local, local, scroll, scroll;
}
.dark .prose-de .tscroll{
  background:
    linear-gradient(to right, var(--surface) 30%, rgba(0,0,0,0)),
    linear-gradient(to right, rgba(0,0,0,0), var(--surface) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.6), rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.6), rgba(0,0,0,0)) 100% 0;
  background-repeat:no-repeat;
  background-size:44px 100%, 44px 100%, 16px 100%, 16px 100%;
  background-attachment:local, local, scroll, scroll;
}
.prose-de table{border-collapse:collapse;width:100%;font-size:.9rem}
.prose-de th,.prose-de td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.prose-de thead th{background:var(--surface-2);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.prose-de tbody tr:last-child td{border-bottom:none}
.prose-de td.de,.prose-de th.de{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.prose-de tr.mark td{background:var(--gold-bg)}
.prose-de .ex{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.89rem;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:9px 12px;margin-top:11px;display:flex;flex-direction:column;gap:5px}
.prose-de .ex .id{font-family:inherit;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink-3);font-size:.85rem}
.prose-de .callout{margin-top:12px;border:1px solid var(--gold-line);background:var(--gold-bg);border-radius:4px;padding:11px 13px;font-size:.92rem}
.prose-de .callout .lbl{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block;margin-bottom:4px}

function bootDeutschklasse(start){
  function ready(){ return window.React && window.ReactDOM && window.ReactDOM.createRoot; }
  function add(src, next){
    var s = document.createElement("script");
    s.src = src; s.crossOrigin = "anonymous";
    s.onload = next; s.onerror = next;
    document.head.appendChild(s);
  }
  function fail(){
    document.getElementById("root").innerHTML =
      '<div style="padding:28px;max-width:40rem;font-family:system-ui;line-height:1.6">' +
      '<h2 style="margin:0 0 8px">Halaman gagal dimuat</h2>' +
      '<p style="margin:0;color:#4C5D5C">Koneksi internetmu mungkin sedang putus atau jaringan ' +
      'sekolah memblokir sumber halaman ini. Coba muat ulang, atau buka lewat jaringan lain.</p></div>';
  }
  if(ready()) return start();
  add("https://unpkg.com/react@18.3.1/umd/react.production.min.js", function(){
    add("https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js", function(){
      if(ready()) start(); else fail();
    });
  });
}

<script>
function startDeutschklasse(){
"use strict";

var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;

var KIT_URL = "https://claude.ai/code/artifact/8a392d6c-edda-4385-8c59-4a622cb6a161";

/* =====================================================================
   DATA MATERI
   ===================================================================== */
var TOPICS = [
{
  id:"artikel", num:"01", tag:"Grammatik", time:"11 menit",
  title:"Kata Benda & Artikel Dasar",
  desc:"Gender der / die / das, artikel tak tentu ein / eine / ein, dan posisi Nominativ.",
  lede:"Fondasi dari semua materi berikutnya. Kalau gender kata bendanya sudah nempel, materi Akkusativ nanti terasa gampang banget.",
  videos:[{id:"4cRAhte5oe0", cap:"Gender kata benda & artikel dasar", hook:"Di bahasa Indonesia, meja ya meja. Di Jerman, tiap kata benda bawa \u201cjenis kelamin\u201d sendiri, dan itulah yang menentukan kata sandangnya. Video ini mengenalkan ketiga jenis itu lewat benda-benda yang tiap hari kamu pegang."}],
  summary:[
    {h:"Setiap kata benda punya gender", html:
      '<p class="note">Di bahasa Indonesia, "meja" ya "meja". Di bahasa Jerman setiap kata benda bawa <b>gender</b>, dan gender itu menentukan artikelnya. Ada tiga, plus satu bentuk jamak.</p>'+
      '<div class="tscroll"><table><thead><tr><th>Gender</th><th>Artikel tentu</th><th>Contoh</th></tr></thead><tbody>'+
      '<tr><td><b>Maskulin</b></td><td class="de"><b>der</b></td><td class="de">der Computer · der Vater · der Apfel</td></tr>'+
      '<tr><td><b>Feminin</b></td><td class="de"><b>die</b></td><td class="de">die Tasche · die Mutter · die Limonade</td></tr>'+
      '<tr><td><b>Netral</b></td><td class="de"><b>das</b></td><td class="de">das Auto · das Fenster · das Buch</td></tr>'+
      '<tr><td><b>Plural</b></td><td class="de"><b>die</b></td><td class="de">die Freunde · die Jungs</td></tr>'+
      '</tbody></table></div>'+
      '<div class="callout"><span class="lbl">Tips paling penting</span>Jangan hafal <span class="de">Tasche</span> saja — hafalkan <span class="de"><b>die</b> Tasche</span> satu paket. Artikel yang salah bikin seluruh kalimat ikut salah di materi berikutnya.</div>'},
    {h:"Artikel tentu vs artikel tak tentu", html:
      '<p class="note"><b>Artikel tentu</b> (<span class="de">der/die/das</span>) = benda yang <i>sudah jelas mana</i> — sama seperti "itu" atau "-nya". <b>Artikel tak tentu</b> (<span class="de">ein/eine/ein</span>) = "sebuah / seorang", belum spesifik.</p>'+
      '<div class="tscroll"><table><thead><tr><th>Gender</th><th>Bestimmter (tentu)</th><th>Unbestimmter (tak tentu)</th></tr></thead><tbody>'+
      '<tr><td>Maskulin</td><td class="de">der Freund</td><td class="de">ein Freund</td></tr>'+
      '<tr><td>Feminin</td><td class="de">die Freundin</td><td class="de">eine Freundin</td></tr>'+
      '<tr><td>Netral</td><td class="de">das Auto</td><td class="de">ein Auto</td></tr>'+
      '<tr><td>Plural</td><td class="de">die Freunde</td><td class="dim">— (tidak ada)</td></tr>'+
      '</tbody></table></div>'+
      '<p class="note" style="margin-top:11px">Perhatikan: maskulin dan netral sama-sama <span class="de">ein</span>. Yang beda sendiri cuma feminin, pakai <span class="de">eine</span>. Dan plural memang tidak punya bentuk tak tentu — masuk akal, "sebuah teman-teman" kan aneh.</p>'},
    {h:"Nominativ = posisi subjek", html:
      '<p class="note"><b>Nominativ</b> adalah posisi <b>pelaku</b> alias subjek kalimat. Di posisi ini artikel tampil apa adanya, persis seperti di kamus — belum berubah sama sekali.</p>'+
      '<div class="ex">'+
      '<span><b>Der</b> Computer ist teuer. <span class="id">(Komputernya mahal)</span></span>'+
      '<span><b>Die</b> Tasche ist neu. <span class="id">(Tasnya baru)</span></span>'+
      '<span><b>Das</b> Fenster ist sauber. <span class="id">(Jendelanya bersih)</span></span>'+
      '<span><b>Die</b> Freunde sind nett. <span class="id">(Teman-temannya baik)</span></span>'+
      '</div>'+
      '<p class="note" style="margin-top:11px">Ingat baik-baik bentuk Nominativ ini. Di Materi 02 kamu akan lihat bahwa begitu benda pindah jadi <b>sasaran</b>, salah satu dari empat baris di atas berubah — dan cuma satu.</p>'},
    {h:"Petunjuk menebak gender", html:
      '<p class="note">Gender memang harus dihafal, tapi ada pola yang lumayan sering kepakai.</p>'+
      '<ul class="bul">'+
      '<li>Akhiran <span class="de"><b>-e</b></span> sering <b>feminin</b>: <span class="de">die Tasche, die Limonade, die Schule</span></li>'+
      '<li>Akhiran <span class="de"><b>-er</b></span> untuk pelaku/alat sering <b>maskulin</b>: <span class="de">der Lehrer, der Computer, der Schlüssel</span></li>'+
      '<li>Akhiran <span class="de"><b>-chen</b></span> selalu <b>netral</b>: <span class="de">das Mädchen</span></li>'+
      '<li>Orang laki-laki <b>maskulin</b>, perempuan <b>feminin</b>: <span class="de">der Vater · die Mutter · der Bruder · die Freundin</span></li>'+
      '</ul>'+
      '<p class="note" style="margin-top:11px">Ini petunjuk, bukan hukum. Kalau ragu, buka <b>Kamus Cepat</b> di halaman depan — gendernya sudah ditulis di sana.</p>'}
  ],
  ex:[
    {k:"fill", q:"__ Hund ist groß.", hint:"(Hund = maskulin · artikel tentu)", acc:[["der"]], sol:"Der Hund ist groß.", why:"Maskulin di posisi subjek memakai der."},
    {k:"fill", q:"__ Tasche ist neu.", hint:"(Tasche = feminin · artikel tentu)", acc:[["die"]], sol:"Die Tasche ist neu.", why:"Feminin memakai die."},
    {k:"fill", q:"__ Auto ist teuer.", hint:"(Auto = netral · artikel tentu)", acc:[["das"]], sol:"Das Auto ist teuer.", why:"Netral memakai das."},
    {k:"fill", q:"__ Freunde sind nett.", hint:"(Freunde = plural · artikel tentu)", acc:[["die"]], sol:"Die Freunde sind nett.", why:"Plural selalu die, gender aslinya tidak berpengaruh."},
    {k:"fill", q:"Das ist __ Apfel.", hint:"(der Apfel · artikel tak tentu)", acc:[["ein"]], sol:"Das ist ein Apfel.", why:"Maskulin tak tentu adalah ein."},
    {k:"fill", q:"Das ist __ Freundin.", hint:"(die Freundin · artikel tak tentu)", acc:[["eine"]], sol:"Das ist eine Freundin.", why:"Feminin tak tentu adalah eine — satu-satunya yang pakai -e."},
    {k:"fill", q:"Das ist __ Fenster.", hint:"(das Fenster · artikel tak tentu)", acc:[["ein"]], sol:"Das ist ein Fenster.", why:"Netral tak tentu juga ein, sama seperti maskulin."},
    {k:"mc", q:"Kata benda jamak di posisi Nominativ selalu memakai artikel tentu apa?",
      opts:["der","die","das","ein","eine"], ans:1,
      sol:"B. die", why:"Semua kata benda jamak memakai die, dan plural tidak punya bentuk tak tentu."},
    {k:"rf", q:"Das ist eine Computer.", ans:false, fix:["das ist ein computer"],
      sol:"FALSCH → Das ist ein Computer.", why:"der Computer maskulin, jadi bentuk tak tentunya ein, bukan eine."}
  ]
},
{
  id:"akkusativ", num:"02", tag:"Grammatik", time:"13 menit",
  title:"Akkusativ für Anfänger & Kata Kerja",
  desc:"Aturan emas Akkusativ plus daftar kata kerja yang wajib diikuti objek.",
  lede:"Inti dari seluruh portal ini. Begitu kamu paham siapa pelaku dan siapa sasaran, separuh urusan Akkusativ sudah beres.",
  videos:[{id:"4i5rbghwRto", cap:"Akkusativ für Anfänger", hook:"Bayangkan kamu ditraktir, bukan mentraktir. Posisimu berubah, dan di bahasa Jerman kata bendanya ikut berubah bentuk. Video ini menunjukkan kapan tepatnya perubahan itu terjadi \u2014 dan kenapa cuma satu jenis benda yang kena."}],
  summary:[
    {h:"Apa itu Akkusativ?", html:
      '<p class="note">Kata benda yang jadi <b>objek langsung</b> — sasaran dari sebuah tindakan — disebut <span class="de">Akkusativobjekt</span>. Dia menjawab pertanyaan <span class="de"><b>Wen?</b></span> (siapa yang dikenai) atau <span class="de"><b>Was?</b></span> (apa yang dikenai).</p>'+
      '<p class="note">Analogi pertemanan: <i>Roky mentraktir Yudha makan mie ayam.</i></p>'+
      '<ul class="bul"><li><b>Roky</b> = pelaku, posisi subjek (Nominativ)</li><li><b>Yudha</b> = yang ditraktir, posisi objek (Akkusativ)</li></ul>'+
      '<p class="note" style="margin-top:10px">Tukar posisinya jadi <i>Yudha mentraktir Roky</i>, artinya berubah total. Itulah kenapa bahasa Jerman menandai posisi ini lewat artikel.</p>'},
    {h:"The Golden Rule", html:
      '<div class="callout"><span class="lbl">Hafalin ini saja</span><b>Hanya kata benda Maskulin yang berubah bentuk.</b> Feminin, Netral, dan Plural tetap sama persis seperti di Materi 01.</div>'+
      '<div class="tscroll"><table><thead><tr><th>Gender</th><th>Nominativ (subjek)</th><th>Akkusativ (objek)</th><th>Keterangan</th></tr></thead><tbody>'+
      '<tr class="mark"><td><b>Maskulin</b></td><td class="de">der / ein / mein / kein</td><td class="de"><b>den / einen / meinen / keinen</b></td><td class="hi"><b>BERUBAH</b></td></tr>'+
      '<tr><td>Feminin</td><td class="de">die / eine</td><td class="de">die / eine</td><td class="dim">Tetap sama</td></tr>'+
      '<tr><td>Netral</td><td class="de">das / ein</td><td class="de">das / ein</td><td class="dim">Tetap sama</td></tr>'+
      '<tr><td>Plural</td><td class="de">die</td><td class="de">die</td><td class="dim">Tetap sama</td></tr>'+
      '</tbody></table></div>'},
    {h:"Verben mit Akkusativ — kata kerja pendamping", html:
      '<p class="note">Kata kerja berikut hampir selalu diikuti objek. Begitu ketemu salah satunya, otak kamu harus langsung nyala: <i>awas, benda maskulin di belakangnya harus berubah.</i></p>'+
      '<div class="tscroll"><table><thead><tr><th>Verb</th><th>Arti</th><th>Contoh</th></tr></thead><tbody>'+
      '<tr><td class="de"><b>haben</b></td><td>memiliki</td><td class="de">Sie hat <b>ein</b> Auto.</td></tr>'+
      '<tr><td class="de"><b>brauchen</b></td><td>membutuhkan</td><td class="de">Ich brauche <b class="hi">den</b> Stift.</td></tr>'+
      '<tr><td class="de"><b>essen</b></td><td>makan</td><td class="de">Er isst <b class="hi">einen</b> Apfel.</td></tr>'+
      '<tr><td class="de"><b>trinken</b></td><td>minum</td><td class="de">Sie trinkt <b class="hi">einen</b> Kaffee.</td></tr>'+
      '<tr><td class="de"><b>sehen</b></td><td>melihat</td><td class="de">Ich sehe <b class="hi">den</b> Hund.</td></tr>'+
      '<tr><td class="de"><b>kaufen</b></td><td>membeli</td><td class="de">Wir kaufen <b>die</b> Tasche.</td></tr>'+
      '<tr><td class="de"><b>finden</b></td><td>menemukan</td><td class="de">Ich finde <b class="hi">den</b> Schlüssel.</td></tr>'+
      '<tr><td class="de"><b>kennen</b></td><td>mengenal</td><td class="de">Kennst du <b class="hi">den</b> Lehrer?</td></tr>'+
      '<tr><td class="de"><b>nehmen</b></td><td>mengambil / menaiki</td><td class="de">Er nimmt <b class="hi">den</b> Bus.</td></tr>'+
      '<tr><td class="de"><b>besuchen</b></td><td>mengunjungi</td><td class="de">Wir besuchen <b>die</b> Freunde.</td></tr>'+
      '</tbody></table></div>'+
      '<p class="note" style="margin-top:11px">Sembilan yang pertama itu daftar wajib hafal. Semuanya kata kerja yang kepakai tiap hari — makan, minum, beli, butuh, lihat.</p>'},
    {h:"Kesalahan yang paling sering terjadi", html:
      '<div class="ex"><span>❌ Ich sehe <b>der</b> Hund.</span><span>✅ Ich sehe <b class="hi">den</b> Hund.</span>'+

{
  id:"possessiv", num:"03", tag:"Grammatik", time:"14 menit",
  title:"Keluarga & Kepemilikan (Possessivartikel)",
  desc:"mein, dein, sein, ihr, unser, euer — untuk bercerita soal keluarga dan barang-barangmu.",
  lede:"Aturannya sama persis dengan Akkusativ, cuma sekarang yang berubah adalah kata kepemilikannya.",
  videos:[{id:"luhPMbPRs3o", cap:"Possessivartikel & kosakata keluarga", hook:"\u201cIbuku\u201d, \u201cadikmu\u201d, \u201chapenya\u201d \u2014 tiap hari kamu pakai kata-kata ini tanpa mikir. Video ini menunjukkan cara mengatakannya dalam bahasa Jerman untuk anggota keluarga dan barang-barang di sekitarmu."}],
  summary:[
    {h:"Daftar dasar Possessivartikel", html:
      '<p class="note">Hafalkan bentuk dasarnya dulu, baru dipasang ke kalimat.</p>'+
      '<div class="tscroll"><table><thead><tr><th>Subjek</th><th>Possessiv</th><th>Arti</th></tr></thead><tbody>'+
      '<tr><td class="de">ich</td><td class="de"><b>mein</b></td><td>milikku</td></tr>'+
      '<tr><td class="de">du</td><td class="de"><b>dein</b></td><td>milikmu</td></tr>'+
      '<tr><td class="de">er</td><td class="de"><b>sein</b></td><td>miliknya (laki-laki)</td></tr>'+
      '<tr><td class="de">sie</td><td class="de"><b>ihr</b></td><td>miliknya (perempuan)</td></tr>'+
      '<tr><td class="de">es</td><td class="de"><b>sein</b></td><td>miliknya (netral)</td></tr>'+
      '<tr><td class="de">wir</td><td class="de"><b>unser</b></td><td>milik kami</td></tr>'+
      '<tr><td class="de">ihr</td><td class="de"><b>euer</b></td><td>milik kalian</td></tr>'+
      '<tr><td class="de">Sie / sie</td><td class="de"><b>Ihr / ihr</b></td><td>milik Anda / milik mereka</td></tr>'+
      '</tbody></table></div>'},
    {h:"Kosakata keluarga & benda sekitar", html:
      '<div class="tscroll"><table><thead><tr><th>Familie</th><th>Arti</th><th>Gegenstände</th><th>Arti</th></tr></thead><tbody>'+
      '<tr><td class="de">der Vater</td><td>ayah</td><td class="de">der Computer</td><td>komputer</td></tr>'+
      '<tr><td class="de">die Mutter</td><td>ibu</td><td class="de">die Tasche</td><td>tas</td></tr>'+
      '<tr><td class="de">der Bruder</td><td>saudara laki-laki</td><td class="de">das Fenster</td><td>jendela</td></tr>'+
      '<tr><td class="de">der Freund</td><td>teman laki-laki</td><td class="de">das Auto</td><td>mobil</td></tr>'+
      '<tr><td class="de">die Freundin</td><td>teman perempuan</td><td class="de">der Schlüssel</td><td>kunci</td></tr>'+
      '</tbody></table></div>'+
      '<div class="ex"><span>Mein Vater ist alt. · Meine Mutter ist jung. · Mein Bruder ist klug.</span>'+
      '<span class="id">Perhatikan: Vater dan Bruder maskulin jadi cukup mein, sedangkan Mutter feminin jadi meine.</span></div>'},
    {h:"Di posisi subjek (Nominativ)", html:
      '<p class="note">Benda <b>maskulin</b> dan <b>netral</b> → bentuk dasar, tanpa tambahan. Benda <b>feminin</b> → tambah <b class="hi">-e</b>.</p>'+
      '<div class="ex">'+
      '<span>Das Fenster ist sauber. → <b>Mein</b> Fenster ist sauber. / <b>Unser</b> Fenster ist sauber. <span class="id">(das — netral)</span></span>'+
      '<span>Die Tasche ist neu. → <b>Seine</b> Tasche ist neu. / <b>Ihre</b> Tasche ist neu. <span class="id">(die — feminin, +e)</span></span>'+
      '<span>Der Computer ist teuer. → <b>Ihr</b> Computer ist teuer. / <b>Euer</b> Computer ist teuer. <span class="id">(der — maskulin, tetap polos)</span></span>'+
      '</div>'},
    {h:"Di posisi objek (Akkusativ)", html:
      '<div class="callout"><span class="lbl">Inti materi</span>Begitu benda <b>maskulin</b> jadi sasaran/objek, kata kepemilikannya <b>wajib</b> ditambah <span class="de hi">-en</span>. Feminin cukup <span class="de">-e</span>, netral tidak berubah.</div>'+
      '<div class="tscroll"><table><thead><tr><th>Subjek</th><th>Nominativ (der / das)</th><th>Akkusativ (objek maskulin)</th><th>Akkusativ (objek feminin)</th></tr></thead><tbody>'+
      '<tr class="mark"><td class="de">ich</td><td class="de">mein</td><td class="de"><b>meinen</b></td><td class="de">meine</td></tr>'+
      '<tr><td class="de">du</td><td class="de">dein</td><td class="de"><b>deinen</b></td><td class="de">deine</td></tr>'+
      '<tr><td class="de">er / es</td><td class="de">sein</td><td class="de"><b>seinen</b></td><td class="de">seine</td></tr>'+
      '<tr><td class="de">sie</td><td class="de">ihr</td><td class="de"><b>ihren</b></td><td class="de">ihre</td></tr>'+
      '<tr><td class="de">wir</td><td class="de">unser</td><td class="de"><b>unseren</b></td><td class="de">unsere</td></tr>'+
      '<tr><td class="de">ihr</td><td class="de">euer</td><td class="de"><b>euren</b></td><td class="de">eure</td></tr>'+
      '<tr><td class="de">Sie / sie</td><td class="de">Ihr / ihr</td><td class="de"><b>Ihren / ihren</b></td><td class="de">Ihre / ihre</td></tr>'+
      '</tbody></table></div>'+
      '<div class="ex">'+
      '<span>Ich besuche <b class="hi">meinen</b> Freund. <span class="id">(der Freund — maskulin, +en)</span></span>'+
      '<span>Ich besuche <b>meine</b> Freundin. <span class="id">(die Freundin — feminin, +e)</span></span>'+
      '<span>Ich habe <b class="hi">einen</b> Freund. · Ich habe <b>eine</b> Freundin.</span>'+
      '<span>Rafaela besucht <b>ihre</b> Mutter. <span class="id">(die Mutter — feminin)</span></span>'+
      '</div>'+
      '<ul class="bul" style="margin-top:12px"><li><b>Langkah 1</b> — Bendanya <span class="de">der</span> atau bukan?</li>'+
      '<li><b>Langkah 2</b> — Kalau <span class="de">der</span> <i>dan</i> posisinya objek, tambahkan <b class="hi">-en</b>. Kalau bukan, jangan diapa-apakan.</li></ul>'}
  ],
  ex:[
    {k:"fill", q:"ich → Akkusativ objek maskulin: __", hint:"Lengkapi tabel Possessivartikel", acc:[["meinen"]], sol:"meinen", why:"mein + akhiran -en untuk objek maskulin."},
    {k:"fill", q:"du → Nominativ (der / das): __", hint:"Lengkapi tabel Possessivartikel", acc:[["dein"]], sol:"dein", why:"Di posisi subjek, maskulin dan netral memakai bentuk polos."},
    {k:"fill", q:"er → Nominativ (die): __", hint:"Lengkapi tabel Possessivartikel", acc:[["seine"]], sol:"seine", why:"Feminin selalu +e."},

    {k:"fill", q:"Das ist ein Fenster. __ Fenster ist sauber.", hint:"(Milikku · das Fenster)", acc:[["mein"]], sol:"Mein Fenster ist sauber.", why:"Netral di posisi subjek → mein, polos."},
    {k:"fill", q:"Die Tasche ist neu. __ Tasche ist neu.", hint:"(Milik dia laki-laki / er · die Tasche)", acc:[["seine"]], sol:"Seine Tasche ist neu.", why:"Feminin → sein + e."},
    {k:"fill", q:"Der Computer ist teuer. __ Computer ist teuer.", hint:"(Milik mereka / sie · der Computer)", acc:[["ihr"]], sol:"Ihr Computer ist teuer.", why:"Maskulin di posisi subjek tetap polos: ihr."},
    {k:"fill", q:"Ich habe __ Freund.", hint:"(Seorang · der Freund)", acc:[["einen"]], sol:"Ich habe einen Freund.", why:"haben menuntut Akkusativ; der → einen."},
    {k:"fill", q:"Ich besuche __ Freund.", hint:"(Milikku · der Freund)", acc:[["meinen"]], sol:"Ich besuche meinen Freund.", why:"Objek maskulin → mein + en."},
    {k:"fill", q:"Rafaela besucht __ Mutter.", hint:"(Miliknya, perempuan · die Mutter)", acc:[["ihre"]], sol:"Rafaela besucht ihre Mutter.", why:"Objek feminin → ihr + e, bukan -en."},
    {k:"fill", q:"Ich besuche __ Bruder.", hint:"(Milikmu · der Bruder)", acc:[["deinen"]], sol:"Ich besuche deinen Bruder.", why:"Objek maskulin → dein + en."},

    {k:"rf", q:"Mein Bruder ist klug.", ans:true, fix:[], sol:"RICHTIG — tidak perlu diperbaiki.", why:"Bruder di sini subjek, jadi mein tetap polos."},
    {k:"rf", q:"Ich besuche mein Freund.", ans:false, fix:["ich besuche meinen freund"], sol:"FALSCH → Ich besuche meinen Freund.", why:"Freund maskulin dan berposisi objek → wajib meinen."},
    {k:"order", q:"Tulis bahasa Jermannya: “Tasnya (perempuan) baru.”", acc:[["ihre tasche ist neu"]], sol:"Ihre Tasche ist neu.", why:"die Tasche feminin, posisi subjek → ihre."},
    {k:"order", q:"Perbaiki kalimat ini: Rafaela besucht ihr Vater.", acc:[["rafaela besucht ihren vater"]], sol:"Rafaela besucht ihren Vater.", why:"der Vater maskulin dan jadi objek → ihr + en."}
  ]

{
  id:"nicht", num:"05", tag:"Grammatik", time:"9 menit",
  title:"Negasi: Membantah dengan nicht",
  desc:"Cara membantah pernyataan tentang kegiatan, dan di mana persisnya kata nicht diletakkan.",
  lede:"Pasangan langsung Materi 04. Kalimatnya sama, cuma sekarang dibantah. Materi paling singkat, tapi paling sering salah letak.",
  videos:[{id:"1jnW4aKkHtU", cap:"Negasi dengan nicht", hook:"Kadang yang perlu kamu bilang justru kebalikannya: bukan hari ini, bukan main bola, bukan capek. Video ini soal satu kata kecil yang membalikkan seluruh kalimat \u2014 dan letaknya yang sering bikin salah."}],
  summary:[
    {h:"Patokan tunggal", html:
      '<div class="callout"><span class="lbl">Ingat ini saja</span>Taruh <span class="de"><b>nicht</b></span> <b>tepat sebelum bagian yang kamu bantah</b>. Kalau yang dibantah adalah kata kerjanya sendiri, <span class="de">nicht</span> jatuh di <b>akhir kalimat</b>.</div>'+
      '<div class="tscroll"><table><thead><tr><th>Yang dibantah</th><th>Contoh</th><th>Arti</th></tr></thead><tbody>'+
      '<tr class="mark"><td><b>Kegiatan / pelengkap</b></td><td class="de">Wir spielen <b class="hi">nicht</b> Fußball.</td><td>Kami tidak main bola.</td></tr>'+
      '<tr class="mark"><td><b>Kegiatan / pelengkap</b></td><td class="de">Ihr spielt <b class="hi">nicht</b> Gitarre.</td><td>Kalian tidak main gitar.</td></tr>'+
      '<tr><td><b>Kata sifat</b></td><td class="de">Ich bin <b class="hi">nicht</b> müde.</td><td>Aku tidak lelah.</td></tr>'+
      '<tr><td><b>Kata sifat</b></td><td class="de">Das ist <b class="hi">nicht</b> gut.</td><td>Itu tidak baik.</td></tr>'+
      '<tr><td><b>Keterangan waktu</b></td><td class="de">Ich komme <b class="hi">nicht</b> heute.</td><td>Bukan hari ini aku datang.</td></tr>'+
      '<tr><td><b>Keterangan tempat</b></td><td class="de">Laura wohnt <b class="hi">nicht</b> in Wien.</td><td>Laura tidak tinggal di Wina.</td></tr>'+
      '<tr><td><b>Kata kerjanya sendiri</b></td><td class="de">Ich schwimme <b class="hi">nicht</b>.</td><td>Aku tidak berenang.</td></tr>'+
      '</tbody></table></div>'+
      '<p class="note" style="margin-top:11px">Dua baris pertama yang paling sering kepakai buat cerita aktivitas: subjek jamak dari Materi 04 + <span class="de">nicht</span> + kegiatannya.</p>'},
    {h:"nicht atau kein?", html:
      '<div class="tscroll"><table><thead><tr><th class="de">nicht</th><th class="de">kein</th></tr></thead><tbody>'+
      '<tr><td>untuk kata kerja, kata sifat, keterangan</td><td>untuk kata benda ber-<span class="de">ein</span></td></tr>'+
      '<tr><td class="de">Ich bin nicht müde.</td><td class="de">Ich habe keinen Hund.</td></tr>'+
      '<tr><td class="de">Das ist nicht schön.</td><td class="de">Das ist kein Buch.</td></tr>'+
      '</tbody></table></div>'+
      '<p class="note" style="margin-top:11px">Di level ini fokusmu <b class="hi">nicht</b> dulu. <span class="de">kein</span> dibahas tuntas di pelajaran berikutnya — cukup tahu bedanya supaya tidak ketuker.</p>'},
    {h:"Contoh siap pakai", html:

function norm(s){
  return String(s == null ? "" : s).toLowerCase()
    .replace(/ß/g,"ss").replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u")
    .replace(/[.,!?;:’'“”·]/g," ").replace(/\s+/g," ").trim();
}
function loadStore(){
  try{
    var raw = localStorage.getItem(LS);
    if(raw){ var d = JSON.parse(raw); if(d && typeof d === "object") return {ans:d.ans||{}, best:d.best||{}, nama:d.nama||"", evalBest:d.evalBest||0}; }
  }catch(e){}
  return {ans:{}, best:{}, nama:"", evalBest:0};
}
function saveStore(s){ try{ localStorage.setItem(LS, JSON.stringify(s)); }catch(e){} }

          : f > 0  ? "bg-goldBg dark:bg-goldBgD text-gold dark:text-goldD"
                   : "bg-noBg dark:bg-noBgD text-no dark:text-noD";

function ExItem(props){

  var ans = props.ans, setAns = props.setAns, frac = props.frac;
  var key = function(i){ return "in-" + tid + "-" + idx + "-" + i; };
  var val = function(i){ return ans[key(i)] || ""; };
  var put = function(i, v){ setAns(key(i), v); };

  var kindLbl = it.k === "fill" ? "Lückentext" : it.k === "mc" ? "Pilihan Ganda"
              : it.k === "rf" ? "Richtig / Falsch" : "Satzbau";

  function fieldCls(good){
    var base = C.input;
    if(good == null) return base;
    return base + (good ? " !border-ok dark:!border-okD bg-okBg dark:bg-okBgD"
                        : " !border-no dark:!border-noD bg-noBg dark:bg-noBgD");
  }

  var body = null;

  if(it.k === "fill"){
    var parts = it.q.split("__");
    var nodes = [];
    parts.forEach(function(p, i){
      if(p) nodes.push(h("span", {key:"t"+i, className:"whitespace-pre-wrap"}, p));
      if(i < parts.length - 1){
        var good = frac == null ? null : (it.acc[i].indexOf(norm(val(i))) > -1);
        nodes.push(h("input", {
          key:"i"+i, type:"text", value:val(i), placeholder:"…", autoComplete:"off",
          "aria-label":"Isian " + (i+1) + " soal " + (idx+1),
          onChange:function(e){ put(i, e.target.value); },
          className: fieldCls(good) + " !w-auto min-w-[96px] max-w-[200px] flex-[0_1_auto] !px-[9px] !py-[5px] !min-h-[38px]"
        }));
      }
    });
    body = h("div", null,
      h("div", {className:"flex flex-wrap items-center gap-[7px] font-mono text-[.97rem] leading-[2.15]"}, nodes),
      it.hint ? h("p", {className:"text-[.875rem] text-ink3 dark:text-ink3D mt-2"}, it.hint) : null
    );
  }
  else if(it.k === "mc"){
    body = h("div", null,
      h("p", {className:"text-[.95rem] text-ink2 dark:text-ink2D mb-3"}, it.q),
      h("div", {className:"flex flex-col gap-2", role:"radiogroup", "aria-label":"Soal " + (idx+1)},
        it.opts.map(function(o, i){
          var picked = val(0) === String(i);
          var extra = "";
          if(frac != null){
            if(i === it.ans) extra = " !border-ok dark:!border-okD bg-okBg dark:bg-okBgD";
            else if(picked) extra = " !border-no dark:!border-noD bg-noBg dark:bg-noBgD";
          } else if(picked){
            extra = " !border-acc dark:!border-accD bg-accSoft dark:bg-accSoftD";
          }
          return h("label", {key:i,
            className:"flex items-center gap-3 border border-lineS dark:border-lineSD rounded px-3 py-[10px] min-h-[44px] cursor-pointer bg-surf dark:bg-surfD hover:bg-surf2 dark:hover:bg-surf2D" + extra},
            h("input", {type:"radio", name:"mc-"+tid+"-"+idx, checked:picked,
              onChange:function(){ put(0, String(i)); },

/* apakah satu soal sudah terisi penuh? */
function itemFilled(it, tid, idx, ans){
  var k = function(i){ return String(ans["in-" + tid + "-" + idx + "-" + i] || "").trim(); };
  if(it.k === "fill") return it.acc.every(function(_, i){ return k(i) !== ""; });
  if(it.k === "rf")   return k(0) !== "" && (it.ans === true || k(1) !== "");
  return k(0) !== "";
}
function countFilled(exList, tid, ans){
  var n = 0;
  exList.forEach(function(it, i){ if(itemFilled(it, tid, i, ans)) n++; });
  return n;
}

/* mesin penilaian */
function scoreSet(exList, tid, ans){
  var fracs = [], blanks = [], got = 0, max = 0;
  exList.forEach(function(it, idx){
    var k = function(i){ return ans["in-" + tid + "-" + idx + "-" + i] || ""; };
    var f = 0;
    if(it.k === "fill"){
      var c = 0;
      it.acc.forEach(function(list, i){ if(list.indexOf(norm(k(i))) > -1) c++; });
      f = c / it.acc.length; got += c; max += it.acc.length;
    } else if(it.k === "mc"){
      f = (String(it.ans) === k(0)) ? 1 : 0; got += f; max += 1;
    } else if(it.k === "rf"){
      var okPick = k(0) === (it.ans ? "r" : "f");
      if(it.ans === false){
        var okFix = it.fix.indexOf(norm(k(1))) > -1;
        f = ((okPick?1:0) + (okFix?1:0)) / 2;
        got += (okPick?1:0) + (okFix?1:0); max += 2;
      } else {
        f = okPick ? 1 : 0; got += f; max += 1;
      }
    } else {
      f = (it.acc[0].indexOf(norm(k(0))) > -1) ? 1 : 0; got += f; max += 1;
    }
    fracs.push(f);
    blanks.push(!itemFilled(it, tid, idx, ans));
  });
  return {fracs:fracs, blanks:blanks, pct: Math.round((got / max) * 100)};
}

function ExerciseSet(props){
  var exList = props.exList, tid = props.tid;
  var ans = props.ans, setAns = props.setAns;
  var result = props.result, onCheck = props.onCheck, onClear = props.onClear, onRetry = props.onRetry;
  var boxRef = useRef(null), startRef = useRef(null), actionsRef = useRef(null);
  var barSt = useState(false); var showBar = barSt[0], setShowBar = barSt[1];

  useEffect(function(){
    if(result && boxRef.current) boxRef.current.scrollIntoView({behavior:"smooth", block:"nearest"});
  }, [result]);

  /* bilah aksi hanya muncul selagi siswa berada di tengah daftar soal */
  useEffect(function(){
    if(typeof IntersectionObserver === "undefined") return;
    var startEl = startRef.current, endEl = actionsRef.current;
    if(!startEl || !endEl) return;
    var flags = {past:false, atEnd:false};
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.target === startEl) flags.past = (!e.isIntersecting && e.boundingClientRect.top < 0);
        if(e.target === endEl)   flags.atEnd = e.isIntersecting;
      });
      setShowBar(flags.past && !flags.atEnd);
    }, {threshold:0});
    io.observe(startEl);
    io.observe(endEl);
    return function(){ io.disconnect(); };
  }, [tid, result]);

  var filled = countFilled(exList, tid, ans);
  var allFilled = filled === exList.length;
  var adaSalah = result && result.fracs.some(function(f){ return f < 1; });

  var msg = "";
  if(result){
    var pct = result.pct;
    if(pct >= 90) msg = "Nyaris sempurna. Materi ini boleh kamu tandai selesai.";
    else if(pct >= 80) msg = "Tuntas. Baca lagi pembahasan di soal yang merah supaya makin mantap.";
    else if(pct >= 60) msg = "Hampir. Buka pembahasan tiap soal yang salah, lalu tekan Coba lagi.";
    else if(pct >= 30) msg = "Balik dulu ke bagian Ringkasan di atas, terutama tabelnya. Setelah itu coba ulang.";
    else msg = "Santai, ini materi baru. Tonton videonya, baca Ringkasan pelan-pelan, lalu kerjakan lagi.";
    var kosong = result.blanks.filter(Boolean).length;
    if(kosong) msg += " Ada " + kosong + " soal yang belum kamu isi — itu ikut mengurangi nilai.";
  }

  var barBtn = "font-sans font-bold rounded px-4 min-h-[44px] text-[.9rem] bg-acc dark:bg-accD " +
               "text-white dark:text-[#08201F] hover:brightness-110 cursor-pointer border border-transparent flex-none";

  return h("div", null,
    h("div", {ref:startRef, "aria-hidden":"true", className:"h-px"}),
    h("div", {className:"flex flex-col gap-4"},
      exList.map(function(it, i){
        return h(ExItem, {key:i, item:it, idx:i, tid:tid, ans:ans, setAns:setAns,
          frac: result ? result.fracs[i] : null,
          blank: result ? result.blanks[i] : false});
      })
    ),
    h("div", {ref:actionsRef, className:"flex flex-wrap gap-[10px] items-center mt-5"},
      h("button", {type:"button", className:C.btnPrimary, onClick:onCheck}, "Periksa Jawaban"),
      adaSalah ? h("button", {type:"button", className:C.btnGhost, onClick:onRetry}, "Coba lagi yang salah") : null,
      h("button", {type:"button", className:C.btnGhost, onClick:onClear}, "Kosongkan latihan ini")
    ),
    result ? h("div", {ref:boxRef, role:"status", "aria-live":"polite",
        className:"mt-[18px] border border-acc dark:border-accD bg-accSoft dark:bg-accSoftD rounded-md p-[17px]"},
      h("div", {className:"font-display font-extrabold text-[1.9rem] tracking-[-.03em] leading-none text-accInk dark:text-accInkD"},
        "Nilai " + result.pct + " dari 100"),
      h("p", {className:"mt-2 text-[.95rem]"}, msg)
    ) : null,

    showBar ? h("div", {className:"fixed left-0 right-0 bottom-0 z-50 bg-paper dark:bg-paperD border-t border-line dark:border-lineD px-4 sm:px-7 py-2 shadow-[0_-6px_16px_-12px_rgba(0,0,0,.6)]"},
      h("div", {className:"max-w-[56rem] mx-auto flex items-center gap-3"},
        h("span", {className:"text-[.875rem] text-ink2 dark:text-ink2D flex-1 min-w-0"},
          result
            ? ("Nilai " + result.pct + " dari 100")
            : (filled + " dari " + exList.length + " soal terisi" + (allFilled ? " — siap diperiksa" : ""))),
        (result && adaSalah)
          ? h("button", {type:"button", onClick:onRetry, className:barBtn}, "Coba lagi")
          : h("button", {type:"button", onClick:onCheck, className:barBtn}, "Periksa")
      )
    ) : null
  );
}

function Wortschatz(){
  var st = useState("");
  var q = st[0], setQ = st[1];
  var nq = norm(q);
  var groups = VOCAB.map(function(g){
    return {g:g.g, items:g.items.filter(function(it){
      if(!nq) return true;
      return norm(it[0]).indexOf(nq) > -1 || norm(it[1]).indexOf(nq) > -1;
    })};
  }).filter(function(g){ return g.items.length; });
  var shown = groups.reduce(function(a,g){ return a + g.items.length; }, 0);

  return h("section", null,
    h("div", {className:"pt-7 sm:pt-9 pb-4 border-b border-line dark:border-lineD"},
      h("span", {className:C.eyebrow}, "Referensi"),

      h("p", {className:"mt-[11px] text-ink2 dark:text-ink2D max-w-[52ch]"},
        "Ketik kata Jerman atau artinya dalam bahasa Indonesia. Daftar menyaring sendiri sambil kamu mengetik.")

    h("div", {className:"sticky top-[53px] z-20 bg-paper dark:bg-paperD pt-3 pb-[10px] border-b border-line dark:border-lineD"},
      h("input", {type:"text", value:q, "aria-label":"Cari kosakata",
        placeholder:"Cari kata… misalnya: tas, trinken, Apfel",
        onChange:function(e){ setQ(e.target.value); },
        className:C.input + " !font-sans"}),
      h("p", {className:"text-[.875rem] text-ink3 dark:text-ink3D mt-2"},
        shown + " kata ditampilkan" + (nq ? ' untuk "' + q + '"' : ""))
    ),
    groups.length ? groups.map(function(g, gi){
      return h("div", {key:gi, className:"mt-5"},
        h("h4", {className:"font-mono text-[.74rem] tracking-[.11em] uppercase text-ink3 dark:text-ink3D font-semibold mb-[9px]"}, g.g),

          }))
      );
    }) : h("p", {className:"text-[.9rem] text-ink3 dark:text-ink3D mt-5"},
      "Tidak ada yang cocok. Coba potongan katanya saja.")
  );
}

function EvaluasiView(props){
  var nama = props.nama, setNama = props.setNama;
  var ans = props.ans, setAns = props.setAns;
  var result = props.result, onCheck = props.onCheck, onUlang = props.onUlang;

  var dSt = useState(nama || ""); var draft = dSt[0], setDraft = dSt[1];
  var eSt = useState(""); var salah = eSt[0], setSalah = eSt[1];
  var uSt = useState(""); var unduhan = uSt[0], setUnduhan = uSt[1];
  var certRef = useRef(null);

  var tgl = "";
  try { tgl = new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"}); }
  catch(e){ tgl = new Date().toLocaleDateString(); }

  function simpanNama(e){
    if(e && e.preventDefault) e.preventDefault();
    var v = String(draft || "").trim().replace(/\s+/g, " ");
    if(v.length < 3){ setSalah("Tulis nama lengkapmu dulu, minimal 3 huruf."); return; }
    if(v.length > 40){ setSalah("Nama kepanjangan untuk muat di sertifikat. Pakai maksimal 40 huruf."); return; }
    setSalah(""); setNama(v);
  }

  function unduh(){
    var node = certRef.current;
    if(!node) return;
    if(typeof html2canvas === "undefined"){ setUnduhan("nolib"); return; }
    setUnduhan("proses");
    var w = node.offsetWidth || 600;
    var skala = Math.min(4, Math.max(2, Math.ceil(1100 / w)));
    try {
      html2canvas(node, {scale:skala, backgroundColor:"#FFFFFF", logging:false, useCORS:true})
        .then(function(canvas){
          var url = canvas.toDataURL("image/jpeg", 0.95);
          var a = document.createElement("a");
          a.href = url;
          a.download = "Sertifikat-Deutschklasse-" + nama.replace(/[^A-Za-z0-9]+/g, "-") + ".jpg";
          document.body.appendChild(a); a.click();
          setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 200);
          setUnduhan("selesai");
        })
        .catch(function(){ setUnduhan("gagal"); });
    } catch(err){ setUnduhan("gagal"); }
  }

  var judul = h("div", {className:"pt-7 sm:pt-9 pb-4 border-b border-line dark:border-lineD"},
    h("span", {className:C.eyebrow}, "Evaluasi akhir"),
    h("h1", {className:"font-display font-extrabold text-[1.7rem] sm:text-[2.3rem] leading-[1.08] tracking-[-.025em] mt-2"},
      "Kuis & Sertifikat"),
    h("p", {className:"mt-[11px] text-ink2 dark:text-ink2D max-w-[52ch]"},
      "Lima soal pilihan ganda dari keempat materi utama. Isi namamu dulu, kerjakan, lalu sertifikatmu bisa langsung diunduh."));

  /* --- Tahap 1: gerbang nama --- */
  if(!nama){
    return h("section", null, judul,
      h("div", {className:"pt-7"},
        h("form", {onSubmit:simpanNama, className:C.card + " p-5 flex flex-col gap-3 max-w-[30rem]"},
          h("label", {htmlFor:"nama-siswa", className:"font-display font-semibold text-[1.02rem]"}, "Nama Lengkap"),
          h("p", {className:"text-[.875rem] text-ink2 dark:text-ink2D"},
            "Nama ini yang akan tercetak di sertifikat. Tulis seperti di absen, bukan nama panggilan."),
          h("input", {id:"nama-siswa", type:"text", value:draft, autoComplete:"name",
            placeholder:"Contoh: Nimas Dinda Fatikasari",
            onChange:function(e){ setDraft(e.target.value); },
            className:C.input + " !font-sans"}),
          salah ? h("p", {className:"text-[.875rem] font-semibold text-no dark:text-noD"}, salah) : null,
          h("button", {type:"submit", className:C.btnPrimary + " self-start"}, "Mulai Kuis"),
          h("p", {className:"text-[.875rem] text-ink3 dark:text-ink3D"},
            "Namamu cuma disimpan di HP ini dan tidak dikirim ke mana pun.")
        )
      )
    );
  }

  /* --- Tahap 2 & 3: kuis, lalu sertifikat --- */
  var pesan = "";
  if(result){
    pesan = result.pct >= 90 ? "Luar biasa. Kamu pegang keempat materi dengan mantap."
          : result.pct >= LULUS_MIN ? "Tuntas. Sertifikatmu siap diunduh."
          : "Skormu masih di bawah " + LULUS_MIN + ". Sertifikatnya tetap bisa diunduh, tapi enaknya ulangi dulu biar angkanya bagus.";
  }

  return h("section", null, judul,
    h("div", {className:"pt-6 flex flex-wrap items-center gap-3"},
      h("span", {className:"text-[.95rem] text-ink2 dark:text-ink2D"},
        "Peserta: ", h("b", {className:"text-ink dark:text-inkD"}, nama)),
      h("button", {type:"button", onClick:function(){ setNama(""); setDraft(""); },
        className:"text-[.875rem] font-semibold text-accInk dark:text-accInkD underline cursor-pointer bg-transparent border-0 p-0"},
        "Ganti nama")
    ),

    h("div", {className:"pt-6"},
      h("div", {className:"flex flex-col gap-4"},
        EVAL.ex.map(function(it, i){
          return h(ExItem, {key:i, item:it, idx:i, tid:EVAL.id, ans:ans, setAns:setAns,
            frac: result ? result.fracs[i] : null,
            blank: result ? result.blanks[i] : false});
        })
      ),
      h("div", {className:"flex flex-wrap gap-[10px] items-center mt-5"},
        h("button", {type:"button", className:C.btnPrimary, onClick:onCheck},
          result ? "Hitung Ulang" : "Kumpulkan Jawaban"),
        result ? h("button", {type:"button", className:C.btnGhost, onClick:onUlang}, "Ulangi kuis") : null
      )
    ),

    result ? h("div", {className:"pt-8"},
      h("h2", {className:"font-display font-extrabold text-[1.25rem] sm:text-[1.5rem] tracking-[-.02em] mb-1"}, "Sertifikat"),
      h("p", {className:"text-ink2 dark:text-ink2D text-[.95rem] mb-4 max-w-[56ch]"}, pesan),
      h("div", {className:"max-w-[34rem]"},
        h(Certificate, {nodeRef:certRef, nama:nama, pct:result.pct, tgl:tgl})),
      BISA_UNDUH
        ? h("div", {className:"flex flex-wrap gap-[10px] items-center mt-4"},
            h("button", {type:"button", className:C.btnPrimary, onClick:unduh},
              unduhan === "proses" ? "Menyiapkan gambar…" : "Unduh Sertifikat (JPG)"))
        : h("div", {className:"mt-4 border border-goldLine dark:border-goldLineD bg-goldBg dark:bg-goldBgD rounded p-3 text-[.9rem]"},
            h("span", {className:"block mb-[5px] font-mono text-[.72rem] tracking-[.1em] uppercase font-semibold text-gold dark:text-goldD"}, "Cara menyimpan"),
            "Di halaman pratinjau ini unduhan diblokir oleh browser. Simpan sertifikatmu dengan screenshot, atau buka modul ini lewat alamat sekolah (GitHub Pages) — di sana tombol unduh JPG berfungsi normal."),
      unduhan === "selesai" ? h("p", {className:"text-[.875rem] text-ok dark:text-okD mt-2 font-semibold"},
        "Sertifikat tersimpan di folder unduhan HP-mu.") : null,
      unduhan === "gagal" ? h("p", {className:"text-[.875rem] text-no dark:text-noD mt-2"},
        "Gambarnya gagal dibuat. Coba muat ulang halaman lalu ulangi, atau screenshot sertifikat di atas.") : null,
      unduhan === "nolib" ? h("p", {className:"text-[.875rem] text-no dark:text-noD mt-2"},
        "Alat pembuat gambar belum termuat — koneksimu mungkin terputus. Muat ulang halaman, atau screenshot sertifikat di atas.") : null
    ) : null
  );
}

function App(){
  var s0 = loadStore();
  var hashState = useState(location.hash);
  var route = hashState[0], setRoute = hashState[1];
  var ansState = useState(s0.ans); var ans = ansState[0], setAnsRaw = ansState[1];
  var bestState = useState(s0.best); var best = bestState[0], setBest = bestState[1];
  var resState = useState(null); var result = resState[0], setResult = resState[1];
  var namaState = useState(s0.nama); var nama = namaState[0], setNama = namaState[1];
  var evState = useState(s0.evalBest); var evalBest = evState[0], setEvalBest = evState[1];

  useEffect(function(){
    function onHash(){ setRoute(location.hash); setResult(null); window.scrollTo(0,0); }
    window.addEventListener("hashchange", onHash);
    return function(){ window.removeEventListener("hashchange", onHash); };
  }, []);

  useEffect(function(){ saveStore({ans:ans, best:best, nama:nama, evalBest:evalBest}); }, [ans, best, nama, evalBest]);

  var firstRender = useRef(true);
  useEffect(function(){
    var k = location.hash.replace(/^#\/?/, "");
    var nama = "Daftar materi";
    TOPICS.forEach(function(t){ if(t.id === k) nama = "Materi " + t.num + " · " + t.title; });
    if(k === "challenge") nama = "Daily Challenge";
    if(k === "wortschatz") nama = "Wortschatz";
    if(k === "evaluasi") nama = "Evaluasi Akhir & Sertifikat";
    document.title = nama + " · Deutschklasse XII ULW";
    if(firstRender.current){ firstRender.current = false; return; }
    var hEl = document.querySelector("main h1");
    if(hEl){
      hEl.setAttribute("tabindex", "-1");
      try { hEl.focus({preventScroll:true}); } catch(e){ hEl.focus(); }
    }
  }, [route]);

  function setAns(key, val){
    setAnsRaw(function(prev){ var n = {}; for(var k in prev) n[k] = prev[k]; n[key] = val; return n; });
  }
  function go(hash){
    if(location.hash === hash){ setRoute(hash); setResult(null); window.scrollTo(0,0); }
    else location.hash = hash;
  }

  var key = route.replace(/^#\/?/, "");
  var topic = null;
  TOPICS.forEach(function(t){ if(t.id === key) topic = t; });
  var isChallenge = key === "challenge";
  var isVocab = key === "wortschatz";
  var isEval = key === "evaluasi";
  var atHome = !topic && !isChallenge && !isVocab && !isEval;

  function doCheck(exList, tid, isTopic){
    var r = scoreSet(exList, tid, ans);
    setResult(r);
    if(isTopic){
      setBest(function(prev){
        if((prev[tid]||0) >= r.pct) return prev;
        var n = {}; for(var k in prev) n[k] = prev[k]; n[tid] = r.pct; return n;
      });
    }
  }
  function doClear(exList, tid, isTopic){
    setAnsRaw(function(prev){
      var n = {};
      for(var k in prev){ if(k.indexOf("in-" + tid + "-") !== 0) n[k] = prev[k]; }
      return n;
    });
    if(isTopic){
      setBest(function(prev){ var n = {}; for(var k in prev){ if(k !== tid) n[k] = prev[k]; } return n; });
    }
    setResult(null);
    window.scrollTo(0,0);
  }

  function doRetry(exList, tid){
    if(!result) return;
    setAnsRaw(function(prev){
      var n = {}; for(var k in prev) n[k] = prev[k];
      exList.forEach(function(it, idx){
        if(result.fracs[idx] >= 1) return;
        for(var i = 0; i < 3; i++) delete n["in-" + tid + "-" + idx + "-" + i];
      });
      return n;
    });
    setResult(null);
  }

  var overall = Math.round(TOPICS.reduce(function(a,t){ return a + (best[t.id]||0); }, 0) / TOPICS.length);

  var page;
  if(topic){
    page = h(TopicView, {topic:topic, go:go, ans:ans, setAns:setAns, result:result,
      onCheck:function(){ doCheck(topic.ex, topic.id, true); },
      onClear:function(){ doClear(topic.ex, topic.id, true); },
      onRetry:function(){ doRetry(topic.ex, topic.id); }});
  } else if(isChallenge){
    page = h(ChallengeView, {ans:ans, setAns:setAns, result:result,
      onCheck:function(){ doCheck(CHALLENGE.ex, CHALLENGE.id, false); },
      onClear:function(){ doClear(CHALLENGE.ex, CHALLENGE.id, false); },
      onRetry:function(){ doRetry(CHALLENGE.ex, CHALLENGE.id); }});
  } else if(isEval){
    page = h(EvaluasiView, {nama:nama, setNama:function(v){ setNama(v); setResult(null); },
      ans:ans, setAns:setAns, result:result,
      onCheck:function(){
        var r = scoreSet(EVAL.ex, EVAL.id, ans);
        setResult(r);
        if(r.pct > (evalBest || 0)) setEvalBest(r.pct);
      },
      onUlang:function(){ doClear(EVAL.ex, EVAL.id, false); }});
  } else if(isVocab){
    page = h(Wortschatz, null);
  } else {
    page = h(Home, {best:best, go:go, evalBest:evalBest});
  }

  return h("div", null,
    h("header", {className:"sticky top-0 z-40 bg-paper dark:bg-paperD border-b border-line dark:border-lineD shadow-[0_6px_14px_-12px_rgba(0,0,0,.5)]"},
      h("div", {className:"max-w-[56rem] mx-auto px-4 sm:px-7 py-[9px] flex items-center gap-3 min-h-[52px]"},
        h("button", {type:"button", onClick:function(){ go("#/"); },
          className:"flex items-center gap-[9px] font-display font-extrabold tracking-[-.02em] text-base bg-transparent border-0 cursor-pointer text-ink dark:text-inkD p-0"},
          h("span", {className:"w-6 h-6 rounded-[5px] bg-acc dark:bg-accD grid place-items-center text-white dark:text-[#08201F] font-mono text-[.76rem] font-semibold"}, "DE"),
          h("span", null, "Deutschklasse",
            h("span", {className:"hidden min-[390px]:inline"}, " XII ULW"))),
        h("span", {className:"flex-1"}),
        h("span", {className:"font-mono text-[.76rem] font-semibold text-accInk dark:text-accInkD bg-accSoft dark:bg-accSoftD rounded-full px-[11px] py-[5px] whitespace-nowrap"},
          overall + "%"),
        atHome ? null : h("button", {type:"button", onClick:function(){ go("#/"); },
          className:"flex items-center gap-[6px] bg-transparent border border-lineS dark:border-lineSD text-ink2 dark:text-ink2D rounded px-3 py-[7px] min-h-[38px] text-[.86rem] font-semibold cursor-pointer hover:bg-surf2 dark:hover:bg-surf2D"},
          "← Daftar materi")
      )
    ),
    h("div", {className:"max-w-[56rem] mx-auto px-4 sm:px-7 pb-28"},
      h("main", null, page),
      h("footer", {className:"mt-12 pt-[18px] border-t border-line dark:border-lineD text-ink3 dark:text-ink3D text-[.875rem] flex flex-col gap-1"},
        h("span", {className:"font-semibold text-ink2 dark:text-ink2D"}, "Dikembangkan untuk SMKN 1 Sewon | Viel Erfolg, kelas 12!"),
        h("span", null, "Bahasa Jerman · Kelas XII ULW · Fase F · TP 2026/2027 · Herr Yudha Nur Wicaksono"),
        h("span", null, "Progresmu tersimpan di HP ini saja, tidak terkirim ke mana-mana.")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
}

bootDeutschklasse(startDeutschklasse);
</script>
